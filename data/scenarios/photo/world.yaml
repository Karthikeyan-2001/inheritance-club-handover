# The second scenario: a synthetic photography club over one monsoon term, 1 Jun to 5 Nov 2026.
# SYNTHETIC: every name, club, shop and number is invented. It differs from the year scenario on
# purpose, to check the pipeline was not tuned to one club: a different cast, an iPhone
# committee chat, a finance chat, a private one-to-one chat uploaded by the outgoing lead,
# minutes as a Word file with dates in words, and no Trello board. Monthly and per-event duties
# instead of semester ones. ground_truth.yaml says what a correct reading finds.
#
# The demo accounts stand in for the roles when these files are imported: Arun uploads (outgoing
# lead, here played by Nisha), Dr. Meena is the advisor (Prof. Iyer), Divya the treasurer
# (Revathi), Kavya the incoming lead (Farhan).
synthetic: true
seed: 23
club: Aperture Photography Club
period: { from: 2026-06-01, to: 2026-11-05 }

people:
  - { name: Nisha,     role: outgoing lead,   nicknames: [Nisha, Nish] }
  - { name: Farhan,    role: incoming lead,   nicknames: [Farhan, Faru] }
  - { name: Revathi,   role: treasurer,       nicknames: [Revathi, Revs] }
  - { name: Joel,      role: exhibitions,     nicknames: [Joel] }
  - { name: Tara,      role: design,          nicknames: [Tara] }
  - { name: Vikram,    role: archive,         nicknames: [Vikram, Vicky] }
  - { name: Prof. Iyer, role: faculty advisor, nicknames: [sir] }

filler:
  typoRate: 0.05
  mediaRate: 0.06
  deletedRate: 0.01
  things: [tripod, light stand, reflector, memory cards, exhibition layout, print proofs, contact sheet, camera bag, lens cloth, frame list, photo walk route, editing laptop]
  places: [studio room, library, canteen, exhibition hall, main gate, department office, terrace, parking]
  times: ["4", "5:30", "6 pm", "7 pm", "noon"]
  tamil:
    - Light semma ah irukku
    - Enna da, shoot cancel ah?
    - Nalla shot da
    - Seri, naalaiku paarkalaam
    - Aiyo, battery dead
    - Golden hour ku vaanga
  templates:
    committee:
      - Anyone seen the {thing}?
      - "{who} the {thing} is in the studio room"
      - Light is good on the {place} today
      - Class got over early, free till {time}
      - "{tamil}"
      - Is the {place} open now?
      - The {thing} needs charging
      - "{who} check the group drive for the {thing}"
      - lol {who} that photo
      - Rain again, outdoor shoot is off
      - Who has the key to the {place}?
      - The {thing} looks fine to me
      - "{tamil}"
    accounts:
      - Receipt uploaded to the drive
      - "{who} please check the sheet"
      - Bank is closed today
      - Ok noted
    direct:
      - Good evening
      - Noted, thank you
      - Is the {place} free on Friday?
      - Ok

chats:
