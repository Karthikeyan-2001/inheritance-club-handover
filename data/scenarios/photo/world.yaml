    format: iphone
    group: Aperture Committee
    accessLevel: committee
    creator: Nisha
    template: committee
    startsAt: "2026-06-01 10:00"
    members: [Nisha, Farhan, Revathi, Joel, Tara, Vikram]
    perDay: { default: 1.5, "2026-08": 3, "2026-09": 3 }
    system:
      - { at: "2026-08-01 09:00", by: Nisha, text: "Nisha changed the group name to “Aperture Committee 2026”" }
    beats:
      # Duties stated in chat.
      - { at: "2026-06-10 19:00", by: Nisha, say: "Reminder: the equipment log goes to the department office every month, signed by the HoD." }
      - { at: "2026-07-01 17:30", by: Vikram, say: "June equipment log submitted to the department office, HoD signed it." }
      - { at: "2026-07-03 18:30", by: Joel, say: "The photo exhibition is in September every year. If outside visitors come we need the Principal's approval." }
      - { at: "2026-07-25 20:15", by: Nisha, say: "The exhibition hall needs the Chief Warden's clearance before every exhibition, so apply two weeks ahead." }
      # Commitments.
      - { at: "2026-07-25 20:20", by: Nisha, say: "I'll get the Chief Warden's clearance for the exhibition hall by 1 September." }
      - { at: "2026-08-22 17:10", by: Nisha, say: "Chief Warden's clearance for the exhibition hall is done, the letter is with me." }
      - { at: "2026-08-02 18:00", by: Joel, say: "I'll collect the exhibition prints from Pixel Hub by 20 August." }
      - { at: "2026-08-19 16:45", by: Joel, say: "Collected all 30 exhibition prints from Pixel Hub, delivered to the hall today." }
      - { at: "2026-08-05 21:00", by: Tara, say: "I will design the exhibition poster by 25 August." }
      - { at: "2026-08-27 13:20", by: Vikram, say: "The exhibition posters are up near the library." }
      - { at: "2026-08-29 19:40", by: Farhan, say: "I'll return the borrowed tripods to Mr. Dsouza by 15 September." }
      - { at: "2026-09-14 18:05", by: Farhan, say: "Returned the tripods to Mr. Dsouza." }
      - { at: "2026-09-02 21:10", by: Vikram, say: "I'll back up the photo archive to the department drive by 30 September." }
      - { at: "2026-10-08 12:30", by: Farhan, say: "Sent the lab licence request to the IT cell." }
      - { at: "2026-10-28 20:00", by: Nisha, say: "I'll hand over the club camera and the cupboard keys to Farhan by 10 November." }
      # Decoys: hedged, not promises.
      - { at: "2026-07-12 18:00", by: Joel, say: "Maybe I'll shoot the convocation too, paarkalaam." }
      - { at: "2026-08-10 20:30", by: Tara, say: "Might ask the alumni for old negatives, not sure." }
      - { at: "2026-09-20 19:15", by: Vikram, say: "We should probably start a photo walk series someday." }

  - file: whatsapp-accounts.txt
