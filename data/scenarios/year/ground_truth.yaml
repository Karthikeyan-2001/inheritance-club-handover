# Text that belongs to a restricted level: finance amounts, and the private chat's subject. The
# leak tests check that no role below `level` can read it anywhere (rows, prompts that write
# stored text, pages). It may appear only in files at or above `level`.
restricted:
  - { level: private, text: "medical leave" }
  - { level: private, text: "condonation" }
  - { level: finance, text: "₹45,000" }
  - { level: finance, text: "₹41,300" }
  - { level: finance, text: "₹1,500" }
  - { level: finance, text: "₹12,400" }
  - { level: finance, text: "₹8,000" }
