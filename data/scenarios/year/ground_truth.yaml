# What a correct reading of the year scenario contains (SYNTHETIC). Written by hand before the
# files were generated; the generator tests check that every quote is really in its file.
# `expectedStatus` is firm. `expectedTrust` follows the Phase 6 rule (corroborated needs two
# agreeing records from different files or different people); it is null where several sources
# restate a promise and the rule's answer depends on how the extractor folds them, so Phase 12
# scoring should not count those. Quotes are verbatim from the named file.
synthetic: true
files:
  whatsapp-committee.txt: { type: whatsapp, accessLevel: committee }
  whatsapp-volunteers.txt: { type: whatsapp, accessLevel: everyone }
  trello-board.json: { type: trello, accessLevel: committee }
  minutes.md: { type: minutes, accessLevel: finance }
  WhatsApp Chat with Arun.txt: { type: whatsapp, accessLevel: private, uploader: meena }

