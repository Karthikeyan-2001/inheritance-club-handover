# The year scenario: one synthetic IoT club, 1 Nov 2025 to 31 Oct 2026. SYNTHETIC: every name,
# club and number is invented. The generator (scripts/generate-scenario.ts) turns this file into
# the four export files next to it, the same way every time (`seed`). The planted messages
# (`beats`), card histories and meetings are written here word for word; only the filler chat
# between them is made from templates. ground_truth.yaml says what a correct reading finds.
synthetic: true
seed: 11
club: IoT Club
period: { from: 2025-11-01, to: 2026-10-31 }

people:
  - { name: Arun,    role: outgoing lead, nicknames: [Arun, Aru] }
  - { name: Kavya,   role: incoming lead, nicknames: [Kavya, Kav] }
  - { name: Priya,   role: events,        nicknames: [Priya, Pri] }
  - { name: Divya,   role: treasurer,     nicknames: [Divya, Divs] }
  - { name: Rohan,   role: tech,          nicknames: [Rohan, Ro] }
  - { name: Karthik, role: member,        nicknames: [Karthik, Kar] }
  - { name: Meghna,  role: design,        nicknames: [Meghna, Meg] }
  - { name: Sanjay,  role: volunteer,     nicknames: [Sanjay] }
  - { name: Lakshmi, role: volunteer,     nicknames: [Lakshmi, Laks] }
  - { name: Imran,   role: volunteer,     nicknames: [Imran] }
  - { name: Ananya,  role: volunteer,     nicknames: [Ananya, Anu] }

filler:
  typoRate: 0.04
  mediaRate: 0.03
  deletedRate: 0.012
  things: [router, poster, budget sheet, lab schedule, sensor kit, workshop slides, fest schedule, sponsor deck, breadboards, soldering station, banner design, attendance sheet]
  places: [canteen, IoT lab, library, auditorium, seminar hall, main gate, department office, parking]
  times: ["4", "5", "6 pm", "7 pm", "noon"]
  tamil:
    - Seri da
    - Enna da idhu
    - Romba nalla irukku
    - Machan, lab key yaar kitta irukku?
    - Innaiku class illa da
    - Bus romba late da
    - Semma da
    - Aama da, same doubt enakkum
  templates:
    committee:
      - Anyone has the {thing}?
      - "{who} did you see the {thing} message?"
      - The {thing} is in the shared drive, check it
      - Class got cancelled today, free till {time}
      - "{tamil}"
      - Is the {place} open now?
      - Lunch at the canteen? {place} is crowded though
      - "{who} you free tomorrow evening?"
      - Exam timetable is out, check the notice board
      - The {thing} looks good to me
      - Which {thing} are we using, the old one or the new one?
      - lol {who} that was funny
      - Power cut in the {place} again
      - Reached the {place}, where is everyone?
      - The {thing} needs a look when someone gets time
      - Why is the {place} locked today
      - Did anyone see the new {thing}?
      - "{tamil}"
    volunteers:
      - Walkie-talkies need charging, anyone know where the chargers are?
      - Shift chart is in the sheet, please check your slot
      - Which gate do we use for the guests?
      - Tea break at {time}?
      - "{who} where are you, we are at the {place}"
      - Reached the {place}
      - "{tamil}"
      - Lanyards are in the box near the {place}
      - Is the {place} open yet?
      - Please check the {thing} once

chats:
  - file: whatsapp-committee.txt
    format: android
    group: IoT Club Committee
    accessLevel: committee
    creator: Priya
    template: committee
    startsAt: "2025-11-01 09:00"
    members: [Priya, Arun, Kavya, Divya, Rohan, Karthik, Meghna]
    perDay: { default: 3, "2026-01": 6, "2026-02": 6, "2026-04": 2, "2026-05": 0.5, "2026-06": 0.3, "2026-10": 4 }
    system:
      - { at: "2026-01-20 21:00", text: "Priya changed the group description" }
      - { at: "2026-02-02 10:30", text: "Meghna changed this group's icon" }
      - { at: "2026-05-14 18:00", text: "Karthik left" }
      - { at: "2026-06-20 12:00", text: "Karthik joined using this group's invite link" }
    beats:
      # Lab permission letter, every semester (HoD): Nov, Jan, Jul, Oct.
      - { at: "2025-11-08 19:10", by: Priya, say: "Reminder: the HoD's permission letter has to be approved before we book the lab, every semester. Last year they rejected us without it." }
      - { at: "2025-11-08 19:15", by: Arun, say: "I'll get the lab permission letter signed by the HoD by 14 November." }
      - { at: "2025-11-13 17:40", by: Arun, say: "HoD signed the permission letter today, lab is booked for the 29th." }
      - { at: "2026-01-05 10:20", by: Priya, say: "New semester, so the HoD's permission letter again before we book the lab. It is every semester." }
      - { at: "2026-01-05 10:24", by: Arun, say: "I'll get the lab permission letter signed by 31 January." }
      - { at: "2026-01-23 16:05", by: Arun, say: "Permission letter signed by the HoD, booking the lab now." }
      - { at: "2026-07-18 11:00", by: Arun, say: "Odd semester starts soon. Same rule, every semester the lab needs the HoD's permission letter first." }
      - { at: "2026-07-25 12:30", by: Kavya, say: "I'll get the lab permission letter signed by 7 August for the new semester." }
      - { at: "2026-08-14 15:45", by: Kavya, say: "HoD signed the lab permission letter today, a week late sorry." }
      - { at: "2026-10-12 10:05", by: Arun, say: "Even semester lab bookings need the HoD's permission letter first, as always." }
      - { at: "2026-10-12 10:08", by: Arun, say: "I'll get the lab permission letter signed by 31 October." }
      # Auditorium for the annual IoT Fest (Dean's office, a month ahead).
      - { at: "2025-12-05 20:00", by: Priya, say: "IoT Fest is our annual event. The auditorium needs the Dean's office approval, so apply a month ahead." }
      - { at: "2025-12-05 20:04", by: Priya, say: "Last year the fest was on 14 Feb, let's keep the same date." }
      - { at: "2026-01-02 18:30", by: Priya, say: "I will book the auditorium by 10 January." }
      - { at: "2026-01-09 14:20", by: Priya, say: "Auditorium booked for 14 Feb, the Dean's office approved it." }
      - { at: "2026-01-12 19:00", by: Kavya, say: "IoT Fest is on 14 Feb 2026, the poster text needs the date and venue." }
      - { at: "2026-10-14 20:10", by: Priya, say: "Next IoT Fest needs the auditorium again. Dean's office approval, a month ahead, so apply by mid January." }
      # Club registration renewal, every August (Dean's signature, Student Affairs).
      - { at: "2026-07-18 11:12", by: Arun, say: "Club registration renewal is due every August and needs the Dean's signature from Student Affairs. Last August Priya had to chase it for two weeks." }
      - { at: "2026-07-20 19:40", by: Arun, say: "I'll submit the club registration renewal by 10 August." }
      - { at: "2026-08-09 17:25", by: Arun, say: "Registration renewal submitted to Student Affairs today." }
      - { at: "2026-08-30 13:10", by: Arun, say: "Dean signed the registration renewal, we are registered till next August." }
      # Sponsorship, posters, WiFi, boards, certificates, reimbursement.
      - { at: "2026-01-10 19:42", by: Arun, say: "I'll send the sponsorship proposal to Brightwave Labs by 20 January." }
      - { at: "2026-01-21 10:05", by: Arun, say: "Sponsorship proposal sent to Brightwave Labs this morning." }
      - { at: "2026-02-10 18:15", by: Priya, say: "Brightwave Labs confirmed the sponsorship!" }
      - { at: "2026-01-10 19:50", by: Kavya, say: "I will have the fest posters printed by 3 Feb." }
      - { at: "2026-02-03 17:20", by: Kavya, say: "Posters printed, collecting tomorrow morning." }
      - { at: "2026-02-04 16:40", by: Kavya, say: "Posters are up in all the departments." }
      - { at: "2026-01-28 20:15", by: Rohan, say: "I'll set up the WiFi router in the fest hall before 6 Feb." }
      - { at: "2026-02-07 11:30", by: Divya, say: "WiFi in the fest hall still does not work, the router is not connecting." }
      - { at: "2026-02-12 18:00", by: Rohan, say: "I'll return the borrowed ESP32 boards to Bala sir by Friday 27 Feb." }
      - { at: "2026-02-27 16:30", by: Rohan, say: "Returned all 8 boards, Bala sir signed the register." }
      - { at: "2026-02-27 16:31", by: Rohan, say: "<Media omitted>" }
      - { at: "2026-02-25 12:00", by: Arun, say: "I'll send the participation certificates to all workshop speakers by 15 March." }
      - { at: "2026-03-18 12:45", by: Kavya, say: "Speakers are still asking for their certificates, nobody has sent them yet." }
      - { at: "2026-04-08 15:10", by: Divya, say: "Reimbursed Mr. Ganesan the ₹2,400 for his travel today." }
      # The handover document.
      - { at: "2026-10-20 21:00", by: Arun, say: "I'll write the handover document by 15 November." }
      # Decoys: not commitments.
      - { at: "2026-01-12 18:10", by: Rohan, say: "Maybe I'll check the projector too, will see." }
      - { at: "2026-01-12 18:15", by: Divya, say: "We should probably do a hackathon someday." }
      - { at: "2026-03-05 20:00", by: Karthik, say: "Might look at sponsors for next year, not sure." }
      - { at: "2026-03-22 13:00", by: Rohan, say: "Will see if the lab has extra sensors." }
      - { at: "2026-09-02 19:30", by: Meghna, say: "Maybe I'll bring my own projector too, will see." }

